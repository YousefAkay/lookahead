# Lookahead is local-first: with real data the app must only be reachable from this computer.
# That is enforced in code (app/theme.py, `apply`), not here: Streamlit Community Cloud reads this
# same file for the public demo, which must not be bound to localhost (DECISIONS.md 2026-10-11).
# Locally: streamlit run app/Home.py --server.address localhost
[server]
enableStaticServing = true  # serves app/static (the bundled font), nothing else

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"  # hides the Deploy button and developer items
showSidebarNavigation = false  # the pages are linked from the green top bar (app/theme.py)

# --- Look: light, a green top bar, white cards. The target is in docs/design/target; every colour
# is a token named in app/theme.py (a test keeps the two in step and checks WCAG AA contrast).
# No external calls: Manrope is a file in app/static/fonts (SIL Open Font Licence).
[theme]
base = "light"
primaryColor = "#17603E"              # buttons and selected pills
backgroundColor = "#F6F8F6"
secondaryBackgroundColor = "#FFFFFF"  # inputs and the settings panel
textColor = "#14201A"
linkColor = "#17603E"
borderColor = "#E2E8E4"
showWidgetBorder = true
baseRadius = "10px"
buttonRadius = "10px"
font = "Manrope, sans-serif"
headingFont = "Manrope, sans-serif"
baseFontSize = 16
headingFontWeights = [800, 800, 800, 700, 700, 700]
dataframeHeaderBackgroundColor = "#F6F8F6"
dataframeBorderColor = "#E2E8E4"
# Status colours, as in the design: green = money in and good news, blue = the forecast band and
# "detected", amber = a possible shortfall, red only for errors.
greenColor = "#1F7A4F"
greenBackgroundColor = "#E6F3EC"
greenTextColor = "#17603E"
blueColor = "#2E5F9A"
blueBackgroundColor = "#EAF0F8"
blueTextColor = "#2E5F9A"
orangeColor = "#B26B00"
orangeBackgroundColor = "#FDF3E1"
orangeTextColor = "#8A5300"
redColor = "#B3261E"
redBackgroundColor = "#FDECEA"
redTextColor = "#8C1D18"
grayColor = "#55665C"
grayBackgroundColor = "#EEF1EF"
grayTextColor = "#55665C"
chartCategoricalColors = ["#1F7A4F", "#2E5F9A", "#B26B00", "#14201A", "#55665C"]

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F6F8F6"

[[theme.fontFaces]]
family = "Manrope"
url = "app/static/fonts/Manrope-latin.woff2"
weight = "200 800"
style = "normal"
